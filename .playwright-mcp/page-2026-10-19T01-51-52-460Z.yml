    - region [ref=e127]:
      - heading "ABOUT US" [level=2] [ref=e128]
      - generic [ref=e129]:
        - paragraph [ref=e130]: "WILDLINE runs small, guided 4x4 convoy expeditions through the roads most people only see on a map: the high passes of Ladakh and Spiti, the dunes of Rajasthan, the forests of the North East."
        - paragraph [ref=e131]: We cap every convoy at eight vehicles, travel at the pace of the slowest car, and carry the recovery gear, comms and medical support to get everyone back. Far roads. Good company.
        - paragraph [ref=e132]: Every route is scouted by our own crew before the season opens. We know which bridge is out, which pass closes by noon, and which village has the best chai. That local knowledge is what turns a drive into an expedition.
        - paragraph [ref=e133]: Our guests are drivers, photographers, first-timers and families. You do not need to be an expert behind the wheel. You need to be curious, ready for long days, and happy to share a campfire.
        - paragraph [ref=e134]: "We travel light on the land: no littering, no off-track driving, local stays and local guides wherever we go, so the places we love are still there for the next convoy."
