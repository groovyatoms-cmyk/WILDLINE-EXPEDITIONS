<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WILDLINE EXPEDITIONS — Far roads. Good company.</title>
    <meta name="description" content="WILDLINE EXPEDITIONS runs guided 4x4 convoy expeditions through Ladakh, Spiti and the Thar Desert.." />
    <meta name="theme-color" content="#0B0D10" />
    <script>
      // Apply the saved theme before first paint to avoid a dark/light flash.
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light') {
          document.documentElement.dataset.theme = t
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F4F1EA')
        }
      } catch (e) {}
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WILDLINE EXPEDITIONS" />
    <meta property="og:title" content="WILDLINE EXPEDITIONS — Far roads. Good company." />
    <meta property="og:description" content="Guided 4x4 convoy expeditions through Ladakh, Spiti and the Thar Desert." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
